<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ESG Learning Hub is an open curriculum for sustainability, carbon accounting, and the software systems behind them."
    />
    <title>ESG Learning Hub</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back,arrow_forward,balance,book,calculate,cancel,check,check_circle,close,co2,code,conversion_path,dark_mode,dashboard,description,donut_small,eco,error,explore,flag,info,light_mode,lightbulb,link,lock,menu,menu_book,public,quiz,schedule,search,search_off,sticky_note_2&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('esg-learning-hub.theme')
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var storedLocale = localStorage.getItem('esg-learning-hub.locale')
          var locale =
            storedLocale === 'en' || storedLocale === 'pt-BR'
              ? storedLocale
              : (navigator.language || '').toLowerCase().indexOf('pt') === 0
                ? 'pt-BR'
                : 'en'
          document.documentElement.lang = locale
        } catch (error) {
          /* storage unavailable */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
